# Nginx site for School ERP: serves the web app and proxies /api to the Node API (PM2).
#
# Install:  sudo cp deploy/nginx/school-erp.conf /etc/nginx/sites-available/school-erp
#           sudo sed -i 's/erp.example.com/YOUR.DOMAIN/g' /etc/nginx/sites-available/school-erp
#           sudo ln -s /etc/nginx/sites-available/school-erp /etc/nginx/sites-enabled/
#           sudo certbot --nginx -d YOUR.DOMAIN      # obtains the certificate and fills in TLS
#           sudo nginx -t && sudo systemctl reload nginx
#
# The web build is expected in /var/www/school-erp (see deploy/DEPLOYMENT.md).

# Extra brute-force protection in front of the API's own limits (per client IP).
limit_req_zone $binary_remote_addr zone=erp_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=erp_api:10m rate=20r/s;

upstream school_erp_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.example.com;
    # certbot replaces this block with a redirect to https once the certificate exists.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name erp.example.com;

    # Filled in by certbot:
    # ssl_certificate /etc/letsencrypt/live/erp.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/erp.example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml text/csv;

    # Security headers for the web app (the API sets its own through helmet).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Razorpay Checkout is the only third-party code the app loads.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; connect-src 'self' https://*.razorpay.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ---------- API ----------
    location /api/ {
        limit_req zone=erp_api burst=60 nodelay;
        proxy_pass http://school_erp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        # CSV exports can be large; stream them instead of buffering to disk.
        proxy_buffering off;
    }

    location ~ ^/api/v1/auth/(login|forgot-password|reset-password|verify-email)$ {
        limit_req zone=erp_auth burst=10 nodelay;
        proxy_pass http://school_erp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Payment and SMS provider callbacks: no per-IP throttling (they come from a few provider IPs).
    location /api/v1/webhooks/ {
        proxy_pass http://school_erp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Web app (Vite build) ----------
    root /var/www/school-erp;
    index index.html;

    # Hashed build assets never change: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html, which must never be cached.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; connect-src 'self' https://*.razorpay.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
